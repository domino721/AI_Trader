[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-trader"
version = "0.2.0"
description = "Evidence-based investment research and simulated execution foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<2.4",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
ai-trader = "ai_trader.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trader"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/scripts", "/README.md", "/AGENTS.md", "/CHANGELOG.md",
  "/pyproject.toml", "/uv.lock", "/uv.toml", "/.env.example", "/.python-version",
  "/.github/workflows/ci.yml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

